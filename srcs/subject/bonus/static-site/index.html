<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hassende — Inception</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }
        .card {
            background: #1a1a1a;
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid #2a2a2a;

            text-align: center;

        h1 span { color: #58a6ff; }
        p { margin-bottom: 1rem; color: #8b949e; }
        .tag { display: inline-block; background: #58a6ff22; color: #58a6ff; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.875rem; margin: 0.25rem; }
        .sep { width: 40px; height: 2px; background: #30363d; margin: 1.5rem auto; }
    </style>
</head>
<body>
    <div class="card">
        <h1><span>></span> inception</h1>
        <div class="sep"></div>
        <p>System Administration — Docker infrastructure project</p>
        <p>NGINX · WordPress · MariaDB · Redis · Adminer · FTP</p>
        <div>
            <span class="tag">Docker</span>
            <span class="tag">TLSv1.3</span>
            <span class="tag">Alpine</span>
            <span class="tag">PHP-FPM</span>

        <div class="sep"></div>

</body>
